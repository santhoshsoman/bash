# ==============================================================================
# 1. CORE SETTINGS
# ==============================================================================
set -g default-terminal "screen-256color"
set -g default-shell /bin/bash    # Always use bash, not zsh
set -g history-limit 100000       # Scrollback buffer size
set -g base-index 0               # Start window numbering at 0
setw -g pane-base-index 0         # Start pane numbering at 0
set -g renumber-windows on        # Re-number windows when one is closed
set -g set-titles on              # Update terminal title
set -sg escape-time 0             # Zero delay for key sequences

# ==============================================================================
# 2. KEY BINDINGS
# ==============================================================================
# Prefix: Ctrl-A (Easier than Ctrl-B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind-key C-a last-window

# Session / Window Management
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind -n S-Left  previous-window   # Shift+Left  -> Prev Window
bind -n S-Right next-window       # Shift+Right -> Next Window
bind p previous-window
bind n next-window

# VIM Mode & Navigation
set -g status-keys vi
set -g mode-keys vi
set -g mouse off                  # Mouse disabled (Keyboard Warrior Mode)

# Clipboard Integration (OS Agnostic Check)
# Note: For macOS, ensure 'reattach-to-user-namespace' is installed if older version
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line

# Intelligent Copy: Checks for xclip (Linux) or pbcopy (Mac)
if-shell "uname | grep -q Darwin" \
  "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
  "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# ==============================================================================
# 3. ADVANCED COMMANDS (Broadcasting)
# ==============================================================================
# 'E': Broadcast arbitrary command to ALL panes in session
bind E command-prompt -p "Broadcast Command:" \
       "run \"tmux list-panes -s -F '##{session_name}:##{window_index}.##{pane_index}' \
              | xargs -I PANE tmux send-keys -t PANE '%1' Enter\""

# 'r': Reload Environment (Fixed hardcoded path)
# Sources .profile in all panes safely
bind R source-file ${HOME}/santhoshsnair/.tmux.conf \; display "Tmux Config Reloaded!"

# ==============================================================================
# 4. VISUALS & STATUS BAR
# ==============================================================================
# Updates
set -g status-interval 2
set -g status-position bottom
set -g status-justify left

# Colors
set -g status-style fg=colour45,bg=colour237
set -g pane-border-style 'fg=colour8'
set -g pane-active-border-style 'fg=colour3'
set -g message-style fg=colour226,bg=colour237,bold

# Clock
setw -g clock-mode-colour colour196
setw -g clock-mode-style 12

# Status Left/Right
set -g status-left-length 50
set -g status-left ' [ #S ] '

set -g status-right-length 100
# set -g status-right '| #(export PATH=$PATH:${HOME}/santhoshsnair/scripts; which gitmux >/dev/null && gitmux "#{pane_current_path}") | #(TZ=":America/Los_Angeles" date "+%%I:%%M %p | %m-%d-%Y")'
# set -g status-right '| #(which gitmux >/dev/null && gitmux "#{pane_current_path}") | #(TZ=":America/Los_Angeles" date "+%%I:%%M %p | %m-%d-%Y")'
set -g status-right '#(TZ=":Asia/Bangkok" date "+CTH %%a %%I:%%M %%p") | #(TZ=":America/Los_Angeles" date "+CA %%a %%I:%%M %%p | %%m-%%d-%%Y")'

# Window Status Formatting
setw -g window-status-separator '|'
setw -g window-status-current-style fg=colour237,bg=colour45,bold
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-style fg=colour45,bg=colour237
setw -g window-status-format '#[fg=colour45] #I #W #F'

# Activity Alerts
setw -g monitor-activity on
setw -g window-status-activity-style fg=colour238,bg=colour0
setw -g window-status-bell-style fg=colour2,bg=colour1,bold

# ==============================================================================
# 5. PLUGINS (TPM)
# ==============================================================================
set-environment -g TMUX_PLUGIN_MANAGER_PATH "${HOME}/.tmux/plugins"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

# Plugin Config
set -g @resurrect-processes 'ssh mosh'
set -g @continuum-restore 'on'
set -g @continuum-save-interval 15

# Initialize TPM (Keep at bottom)
if-shell "test -f ${HOME}/.tmux/plugins/tpm/tpm" \
   "run '${HOME}/.tmux/plugins/tpm/tpm'"
